[user-repo]
url = "git@example.com:your-org/user-repo.git"
keyfile = "/home/backend/.ssh/id_ed25519_deploy"
branch = "main"

[slurm]
# Optional. Omit or leave empty to use Slurm's default partition/account/time policy.
partition = ""
account = ""
time-limit = ""
extra = []
# "scheduler" passes --mem and --cpus-per-task; "metadata-only" records requirements but does not enforce them.
enforcement = "scheduler"

[agent]
# A turn runs in two sandboxes started through sbox-command. The tool sandbox runs
# pi-glovebox-server from {home}: it binds the session worktree read-write, mounts the files
# of reviewed steps read-only, and executes every bash, read, write and edit call of the
# agent. runner-command runs in a separate sandbox that holds Pi's config and session
# history and sees an empty directory in place of the worktree; it reaches the tools only
# through the server's socket. Pi loads no instructions from the worktree: the backend
# passes AGENTS.md and .pi/skills from the session's base commit explicitly.
# sbox-args apply to the tool sandbox. Argument templates expand the following placeholders:
#   {worktree}    absolute path to the session worktree (the tools' working directory)
#   {home}        per-session HOME of the tools ({worktree}/../home), pre-created and bind-mounted into the tool sandbox
#   {sessionRoot} {worktree}/.., useful for binding turn logs etc.
#   {sessionId}   short opaque session id
sbox-command = "sbox"
sbox-args = ["--bind", "{home}", "{home}"]
runner-command = "pi"
# The backend passes the chat model of the agent that takes each turn to the runner itself.
runner-args = []
# title-prompt = "Name the chat that opens with the request in this message. Reply with the title only: five words at most, no quotes, no punctuation, no explanation."
timeout-seconds = 1800
output-limit-bytes = 1048576
session-retention-days = 7

# AI providers. Each provider names the environment variable that holds its API key,
# so keys never live in this file. The backend reads them from its EnvironmentFile.
# Nothing here is required: with no [models.*] tables the agent has no chat model and
# step search stays lexical only.
[[providers]]
name = "neuralwatt"
base-url = "https://api.neuralwatt.com/v1"
api-key-env = "NEURALWATT_API_KEY"
timeout-seconds = 60

# The agent panel runs on up to two agents that share one conversation. The coder takes
# every turn unless [models.answerer] and [models.router] are both set; then the router, a
# System One decision model, reads each message the user writes and hands it to the answerer
# when it asks a question. Turns the backend starts itself, such as automatic fixes, always go
# to the coder, and so do chat titles and compaction. The backend writes both models into Pi's
# models.json and settings.json before the runner starts, and passes --model explicitly.
#
# Both agents get the same tools, and each keeps its own model, thinking level and system
# prompt for the whole conversation: changing any of them mid-conversation makes the provider
# recompute that model's prompt cache. See
# https://neuralwatt.com/news/why-harnesses-matter-for-energy-efficiency
# [models.coder]
# provider = "neuralwatt"
# protocol = "openai-completions"
# model = "deepseek-v4.1-flash"
# thinking = "high"
# Neuralwatt hosted tools the model may call on every request of the conversation; the
# gateway runs them inside the response. Needs protocol = "openai-completions" and a model
# whose /v1/models entry reports hosted_tools = true; -speed and -fast models report false.
# https://docs.neuralwatt.com/hosted-tools/overview
# hosted-tools = ["nw_web_search"]
#
# [models.coder.pi]
# name = "DeepSeek V4.1 Flash"
# contextWindow = 1000000
# maxTokens = 384000
# input = ["text", "image"]
# reasoning = true
# thinkingLevelMap = { minimal = "low", low = "low", medium = "high", high = "high", xhigh = "xhigh", max = "max" }
# Pi levels the model does not support; they are hidden and skipped when cycling.
# disabledThinkingLevels = ["off"]
# Prices per million tokens; all four are required and must be written as decimals.
# cost = { input = 0.14, output = 0.28, cacheRead = 0.028, cacheWrite = 0.0 }
# compat = { supportsStore = false, supportsDeveloperRole = false, supportsReasoningEffort = true, requiresReasoningContentOnAssistantMessages = true }
# Request headers; Pi expands $NAME from the runner's environment, which holds the chat's
# id in POINTY_AGENT_SESSION_ID. Neuralwatt keeps a conversation on the server that holds
# its prompt cache when X-NW-Conversation-ID stays the same, and X-NW-Tools-Opt-Out keeps
# the hosted tools switched on in its dashboard out of the request.
# headers = { X-NW-Conversation-ID = "$POINTY_AGENT_SESSION_ID", X-NW-Tools-Opt-Out = "nw_consult,nw_look,nw_check_budget" }
#
# [models.answerer]
# provider = "neuralwatt"
# protocol = "openai-completions"
# model = "kimi-k3"
# thinking = "high"
# hosted-tools = ["nw_web_search"]
#
# [models.answerer.pi]
# name = "Kimi K3"
# contextWindow = 1000000
# maxTokens = 131072
# input = ["text", "image"]
# reasoning = true
# thinkingLevelMap = { minimal = "low", low = "low", medium = "high", high = "high", xhigh = "max", max = "max" }
# compat = { supportsStore = false, supportsDeveloperRole = false, supportsReasoningEffort = true, requiresReasoningContentOnAssistantMessages = true }
# headers = { X-NW-Conversation-ID = "$POINTY_AGENT_SESSION_ID", X-NW-Tools-Opt-Out = "nw_consult,nw_look,nw_check_budget" }
#
# [models.router]
# provider = "neuralwatt"
# protocol = "systemone"
# model = "clef-flash"

