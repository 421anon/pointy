<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1110" viewBox="0 0 1200 1110" role="img" aria-labelledby="title desc">
  <title id="title">Revision evaluator worker rack and RAM lifecycle</title>
  <desc id="desc">Expressions route to four Nix evaluation workers. The cache keeps the current revision and recomputes each shard's expressions whenever it warms a Nix process. Initial and replacement processes evaluate the same shard expressions. During startup, an over-limit worker stays online while its limit grows with a warning. Later memory pressure prepares a replacement beside the serving worker, then switches over briefly.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="orange-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ea580c"/>
    </marker>
    <style>
      text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .title { font-size: 24px; font-weight: 700; }
      .section { font-size: 18px; font-weight: 700; }
      .label { font-size: 15px; font-weight: 650; }
      .small { font-size: 13px; }
      .tiny { font-size: 11px; }
      .panel { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; rx: 12; }
      .box { fill: #f8fafc; stroke: #64748b; stroke-width: 2; rx: 9; }
      .api { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 9; }
      .worker { fill: #f8fafc; stroke: #64748b; stroke-width: 2; rx: 8; }
      .worker-selected { fill: #f8fafc; stroke: #2563eb; stroke-width: 3; rx: 10; }
      .tray { fill: #ffffff; stroke: #64748b; stroke-width: 1.5; rx: 5; }
      .active { fill: #ecfdf5; stroke: #059669; stroke-width: 2; rx: 8; }
      .paused { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 8; }
      .standby { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; stroke-dasharray: 7 4; rx: 8; }
      .error { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; rx: 8; }
      .decision { fill: #ffffff; stroke: #64748b; stroke-width: 2; }
      .gauge { fill: #e2e8f0; stroke: #64748b; stroke-width: 1.5; rx: 5; }
      .gauge-fill { fill: #10b981; }
      .line { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
      .blue-line { fill: none; stroke: #2563eb; stroke-width: 2.5; stroke-dasharray: 7 5; marker-end: url(#blue-arrow); }
      .blue-bus { fill: none; stroke: #2563eb; stroke-width: 2.5; stroke-dasharray: 7 5; }
      .orange-line { fill: none; stroke: #ea580c; stroke-width: 2.5; marker-end: url(#orange-arrow); }
      .limit { stroke: #ea580c; stroke-width: 3; }
      .led { fill: #10b981; stroke: #047857; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1200" height="1110" fill="#ffffff"/>
  <text x="40" y="40" class="title">Nix evaluation workers</text>
  <text x="1160" y="40" text-anchor="end" class="small">workers stay ready · completed answers are stored separately</text>

  <rect x="35" y="65" width="1130" height="280" class="panel"/>
  <text x="60" y="98" class="section">Ready worker pool</text>

  <rect x="55" y="130" width="150" height="70" class="box"/>
  <text x="130" y="158" text-anchor="middle" class="label">UserRepo</text>
  <text x="130" y="181" text-anchor="middle" class="small">OutPaths / handlers</text>

  <rect x="235" y="120" width="210" height="90" class="api"/>
  <text x="340" y="148" text-anchor="middle" class="label">Expression request</text>
  <text x="340" y="171" text-anchor="middle" class="small">stable request ID</text>
  <text x="340" y="192" text-anchor="middle" class="small">what to evaluate</text>
  <text x="340" y="207" text-anchor="middle" class="tiny">commit keeps the same worker</text>

  <rect x="475" y="130" width="120" height="70" class="box"/>
  <text x="535" y="158" text-anchor="middle" class="label">Pick worker</text>
  <text x="535" y="181" text-anchor="middle" class="tiny">same ID → same worker</text>

  <path d="M205 165 H235" class="line"/>
  <path d="M445 165 H475" class="line"/>
  <path d="M595 165 H645" class="line"/>

  <rect x="645" y="100" width="490" height="165" class="box"/>
  <text x="665" y="125" class="label">Four workers kept ready</text>

  <g transform="translate(655 137)">
    <rect width="105" height="105" class="worker"/>
    <text x="14" y="21" class="label">W0</text><circle cx="88" cy="17" r="6" class="led"/>
    <rect x="12" y="31" width="81" height="18" class="tray"/><text x="52" y="44" text-anchor="middle" class="tiny">queue</text>
    <rect x="12" y="55" width="81" height="7" class="gauge"/><rect x="13" y="56" width="43" height="5" class="gauge-fill"/><line x1="72" y1="52" x2="72" y2="65" class="limit"/>
    <rect x="12" y="69" width="81" height="28" class="active"/><text x="52" y="87" text-anchor="middle" class="tiny">RUNNING NIX</text>
  </g>
  <g transform="translate(770 137)">
    <rect width="105" height="105" class="worker-selected"/>
    <text x="14" y="21" class="label">W1</text><circle cx="88" cy="17" r="6" class="led"/>
    <rect x="12" y="31" width="81" height="18" class="tray"/><text x="52" y="44" text-anchor="middle" class="tiny">queue</text>
    <rect x="12" y="55" width="81" height="7" class="gauge"/><rect x="13" y="56" width="49" height="5" class="gauge-fill"/><line x1="72" y1="52" x2="72" y2="65" class="limit"/>
    <rect x="12" y="69" width="81" height="28" class="active"/><text x="52" y="87" text-anchor="middle" class="tiny">RUNNING NIX</text>
  </g>
  <g transform="translate(885 137)">
    <rect width="105" height="105" class="worker"/>
    <text x="14" y="21" class="label">W2</text><circle cx="88" cy="17" r="6" class="led"/>
    <rect x="12" y="31" width="81" height="18" class="tray"/><text x="52" y="44" text-anchor="middle" class="tiny">queue</text>
    <rect x="12" y="55" width="81" height="7" class="gauge"/><rect x="13" y="56" width="36" height="5" class="gauge-fill"/><line x1="72" y1="52" x2="72" y2="65" class="limit"/>
    <rect x="12" y="69" width="81" height="28" class="active"/><text x="52" y="87" text-anchor="middle" class="tiny">RUNNING NIX</text>
  </g>
  <g transform="translate(1000 137)">
    <rect width="105" height="105" class="worker"/>
    <text x="14" y="21" class="label">W3</text><circle cx="88" cy="17" r="6" class="led"/>
    <rect x="12" y="31" width="81" height="18" class="tray"/><text x="52" y="44" text-anchor="middle" class="tiny">queue</text>
    <rect x="12" y="55" width="81" height="7" class="gauge"/><rect x="13" y="56" width="55" height="5" class="gauge-fill"/><line x1="72" y1="52" x2="72" y2="65" class="limit"/>
    <rect x="12" y="69" width="81" height="28" class="active"/><text x="52" y="87" text-anchor="middle" class="tiny">RUNNING NIX</text>
  </g>

  <rect x="230" y="255" width="260" height="75" class="api"/>
  <text x="360" y="278" text-anchor="middle" class="label">Backend start or new commit</text>
  <text x="360" y="300" text-anchor="middle" class="small">recompute expressions · warm workers</text>
  <text x="360" y="320" text-anchor="middle" class="tiny">startup: raise limit if needed · no restart</text>
  <path d="M490 294 H1062" class="blue-bus"/>
  <path d="M707 294 V245" class="blue-line"/>
  <path d="M822 294 V245" class="blue-line"/>
  <path d="M937 294 V245" class="blue-line"/>
  <path d="M1052 294 V245" class="blue-line"/>

  <rect x="35" y="365" width="1130" height="220" class="panel"/>
  <text x="60" y="398" class="section">Worker W1 · request and replacement path</text>
  <rect x="65" y="410" width="1070" height="145" class="worker-selected"/>
  <text x="88" y="437" class="label">W1</text><circle cx="122" cy="431" r="7" class="led"/>

  <rect x="150" y="425" width="150" height="43" class="tray"/>
  <text x="225" y="444" text-anchor="middle" class="label">Fast requests</text>
  <text x="225" y="461" text-anchor="middle" class="tiny">handled first</text>
  <rect x="150" y="485" width="150" height="43" class="tray"/>
  <text x="225" y="511" text-anchor="middle" class="label">Background work</text>

  <rect x="345" y="450" width="115" height="55" class="box"/>
  <text x="402" y="483" text-anchor="middle" class="label">One at a time</text>
  <path d="M300 447 H330 V466 H345" class="line"/>
  <path d="M300 507 H330 V489 H345" class="line"/>

  <text x="595" y="428" text-anchor="middle" class="label">Memory used</text>
  <rect x="510" y="438" width="170" height="24" class="gauge"/>
  <rect x="512" y="440" width="95" height="20" class="gauge-fill"/>
  <line x1="640" y1="430" x2="640" y2="468" class="limit"/>
  <text x="640" y="472" text-anchor="middle" class="tiny">limit</text>
  <path d="M640 450 H900 V472 H930" class="orange-line"/>
  <text x="770" y="434" text-anchor="middle" class="tiny">after startup, over limit starts replacement</text>

  <rect x="500" y="480" width="190" height="63" class="active"/>
  <text x="595" y="506" text-anchor="middle" class="label">Running Nix REPL</text>
  <text x="595" y="531" text-anchor="middle" class="tiny">green = ready</text>
  <path d="M460 493 H500" class="line"/>
  <rect x="715" y="495" width="185" height="48" class="api"/>
  <text x="807" y="514" text-anchor="middle" class="small">Current revision</text>
  <text x="807" y="534" text-anchor="middle" class="tiny">recompute W1 expressions</text>
  <path d="M900 520 H915 V505 H930" class="blue-line"/>

  <rect x="930" y="420" width="190" height="105" class="standby"/>
  <text x="1025" y="450" text-anchor="middle" class="label">Replacement slot</text>
  <text x="1025" y="478" text-anchor="middle" class="small">empty until needed</text>
  <text x="1025" y="505" text-anchor="middle" class="tiny">new Nix gets ready here</text>

  <rect x="35" y="605" width="1130" height="490" class="panel"/>
  <text x="60" y="640" class="section">What happens after a request</text>

  <rect x="55" y="675" width="145" height="48" class="box"/>
  <text x="127" y="705" text-anchor="middle" class="label">Regular request</text>
  <rect x="55" y="755" width="145" height="58" class="api"/>
  <text x="127" y="780" text-anchor="middle" class="label">New commit</text>
  <text x="127" y="801" text-anchor="middle" class="small">set current revision</text>

  <rect x="250" y="695" width="180" height="90" class="active"/>
  <text x="340" y="727" text-anchor="middle" class="label">Current Nix process</text>
  <text x="340" y="750" text-anchor="middle" class="small">run request</text>
  <text x="340" y="771" text-anchor="middle" class="small">same process after commit</text>

  <polygon points="505,690 575,740 505,790 435,740" class="decision"/>
  <text x="505" y="735" text-anchor="middle" class="label">Did it work?</text>

  <rect x="615" y="695" width="195" height="90" class="box"/>
  <text x="712" y="722" text-anchor="middle" class="label">Return answer</text>
  <text x="712" y="744" text-anchor="middle" class="small">current Nix keeps serving</text>
  <text x="712" y="765" text-anchor="middle" class="small">check memory separately</text>

  <polygon points="885,690 955,740 885,790 815,740" class="decision"/>
  <text x="885" y="734" text-anchor="middle" class="label">Memory too high?</text>
  <text x="885" y="755" text-anchor="middle" class="small">after success only</text>

  <rect x="985" y="695" width="150" height="90" class="active"/>
  <text x="1060" y="728" text-anchor="middle" class="label">Memory OK</text>
  <text x="1060" y="750" text-anchor="middle" class="small">keep serving</text>

  <rect x="430" y="825" width="150" height="55" class="error"/>
  <text x="505" y="848" text-anchor="middle" class="label">Return error</text>
  <text x="505" y="868" text-anchor="middle" class="small">no memory check</text>

  <path d="M200 699 H250" class="line"/>
  <path d="M200 784 H225 V760 H250" class="blue-line"/>
  <path d="M430 740 H435" class="line"/>
  <path d="M575 740 H625" class="line"/>
  <text x="598" y="724" text-anchor="middle" class="small">yes</text>
  <path d="M505 790 V825" class="line"/>
  <text x="518" y="812" class="small">no</text>
  <path d="M810 740 H815" class="line"/>
  <path d="M955 740 H985" class="line"/>
  <text x="970" y="724" text-anchor="middle" class="small">no</text>

  <rect x="635" y="835" width="210" height="65" class="paused"/>
  <text x="740" y="855" text-anchor="middle" class="label">Old Nix keeps serving</text>
  <text x="740" y="877" text-anchor="middle" class="small">recompute W1 expressions</text>
  <text x="740" y="895" text-anchor="middle" class="tiny">from the current revision</text>
  <path d="M885 790 V813 H740 V835" class="orange-line"/>
  <text x="898" y="812" class="small">yes</text>

  <rect x="635" y="930" width="210" height="65" class="standby"/>
  <text x="740" y="955" text-anchor="middle" class="label">Prepare replacement</text>
  <text x="740" y="976" text-anchor="middle" class="small">start Nix · evaluate all</text>
  <path d="M740 900 V930" class="orange-line"/>

  <polygon points="920,920 990,962 920,1004 850,962" class="decision"/>
  <text x="920" y="956" text-anchor="middle" class="label">New Nix memory</text>
  <text x="920" y="977" text-anchor="middle" class="small">too high?</text>
  <path d="M845 962 H850" class="orange-line"/>

  <rect x="1000" y="915" width="140" height="88" class="paused"/>
  <text x="1070" y="938" text-anchor="middle" class="label">If yes</text>
  <text x="1070" y="960" text-anchor="middle" class="small">double the limit</text>
  <text x="1070" y="979" text-anchor="middle" class="small">until it fits</text>
  <text x="1070" y="997" text-anchor="middle" class="small">warn once</text>
  <path d="M990 962 H1000" class="orange-line"/>

  <rect x="840" y="1040" width="300" height="35" class="active"/>
  <text x="990" y="1063" text-anchor="middle" class="label">Brief swap · use replacement</text>
  <path d="M920 1004 V1040" class="orange-line"/>
  <text x="903" y="1028" text-anchor="end" class="small">no</text>
  <path d="M1070 1003 V1025 H1045 V1040" class="orange-line"/>

</svg>
