<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
  <title id="title">Revision evaluator routing and RAM lifecycle</title>
  <desc id="desc">Expressions route by semantic identity to warm Nix evaluator shards. Commit changes rewarm existing sessions. After each successful evaluation the shard is locked and its RSS is checked. An over-limit shard pauses while a standby warms, then closes the old session and publishes the new one.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="orange-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ea580c"/>
    </marker>
    <style>
      text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .title { font-size: 24px; font-weight: 700; }
      .section { font-size: 18px; font-weight: 700; }
      .label { font-size: 15px; font-weight: 650; }
      .small { font-size: 13px; }
      .panel { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; rx: 12; }
      .box { fill: #f8fafc; stroke: #64748b; stroke-width: 2; rx: 9; }
      .api { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 9; }
      .active { fill: #ecfdf5; stroke: #059669; stroke-width: 2; rx: 9; }
      .paused { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 9; }
      .standby { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; stroke-dasharray: 7 4; rx: 9; }
      .error { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; rx: 9; }
      .decision { fill: #ffffff; stroke: #64748b; stroke-width: 2; }
      .line { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
      .blue-line { fill: none; stroke: #2563eb; stroke-width: 2.5; stroke-dasharray: 7 5; marker-end: url(#blue-arrow); }
      .orange-line { fill: none; stroke: #ea580c; stroke-width: 2.5; marker-end: url(#orange-arrow); }
    </style>
  </defs>

  <rect width="1200" height="850" fill="#ffffff"/>
  <text x="40" y="40" class="title">Revision evaluator</text>
  <text x="1160" y="40" text-anchor="end" class="small">warm evaluator state · OutPaths owns result caching</text>

  <rect x="35" y="65" width="1130" height="245" class="panel"/>
  <text x="60" y="98" class="section">Routing</text>

  <rect x="60" y="125" width="155" height="70" class="box"/>
  <text x="137" y="154" text-anchor="middle" class="label">UserRepo</text>
  <text x="137" y="178" text-anchor="middle" class="small">OutPaths / handlers</text>

  <rect x="265" y="115" width="200" height="90" class="api"/>
  <text x="365" y="143" text-anchor="middle" class="label">RepoExpression</text>
  <text x="365" y="166" text-anchor="middle" class="small">ExpressionId</text>
  <text x="365" y="187" text-anchor="middle" class="small">attribute + apply</text>
  <text x="365" y="202" text-anchor="middle" class="small">revision excluded</text>

  <rect x="515" y="125" width="145" height="70" class="box"/>
  <text x="587" y="153" text-anchor="middle" class="label">Stable hash</text>
  <text x="587" y="178" text-anchor="middle" class="small">mod shard count</text>

  <rect x="715" y="105" width="415" height="125" class="box"/>
  <text x="735" y="132" class="label">Selected warm shard</text>
  <rect x="745" y="150" width="155" height="53" class="box"/>
  <text x="822" y="172" text-anchor="middle" class="label">Priority queues</text>
  <text x="822" y="191" text-anchor="middle" class="small">interactive first</text>
  <rect x="945" y="145" width="155" height="63" class="active"/>
  <text x="1022" y="171" text-anchor="middle" class="label">Active session</text>
  <text x="1022" y="192" text-anchor="middle" class="small">private NixRepl</text>

  <path d="M215 160 H265" class="line"/>
  <path d="M465 160 H515" class="line"/>
  <path d="M660 160 H745" class="line"/>
  <path d="M900 176 H945" class="line"/>
  <path d="M1100 176 H1140 V292 H137 V195" class="line"/>
  <text x="790" y="306" text-anchor="middle" class="small">result</text>

  <rect x="265" y="235" width="250" height="48" class="api"/>
  <text x="390" y="257" text-anchor="middle" class="label">rewarmRevision · new commit</text>
  <text x="390" y="275" text-anchor="middle" class="small">partition expressions + fallback</text>
  <path d="M515 259 H700 V225 H715" class="blue-line"/>
  <text x="610" y="248" text-anchor="middle" class="small">same active sessions</text>
  <text x="1125" y="274" text-anchor="end" class="small">commit itself does not replace a worker</text>

  <rect x="35" y="335" width="1130" height="480" class="panel"/>
  <text x="60" y="370" class="section">Evaluation completion and RAM replacement</text>

  <rect x="55" y="405" width="145" height="48" class="box"/>
  <text x="127" y="435" text-anchor="middle" class="label">Normal evaluation</text>
  <rect x="55" y="485" width="145" height="58" class="api"/>
  <text x="127" y="510" text-anchor="middle" class="label">Commit change</text>
  <text x="127" y="531" text-anchor="middle" class="small">rewarm in place</text>

  <rect x="250" y="425" width="180" height="90" class="active"/>
  <text x="340" y="457" text-anchor="middle" class="label">Current session</text>
  <text x="340" y="480" text-anchor="middle" class="small">evaluate expression</text>
  <text x="340" y="501" text-anchor="middle" class="small">same process for rewarm</text>

  <polygon points="505,420 575,470 505,520 435,470" class="decision"/>
  <text x="505" y="465" text-anchor="middle" class="label">success?</text>
  <text x="505" y="485" text-anchor="middle" class="small">evaluation result</text>

  <rect x="625" y="425" width="175" height="90" class="box"/>
  <text x="712" y="452" text-anchor="middle" class="label">Remember latest</text>
  <text x="712" y="474" text-anchor="middle" class="small">lock shard</text>
  <text x="712" y="495" text-anchor="middle" class="small">read VmRSS</text>

  <polygon points="885,420 955,470 885,520 815,470" class="decision"/>
  <text x="885" y="464" text-anchor="middle" class="label">RSS &gt; limit?</text>
  <text x="885" y="485" text-anchor="middle" class="small">after success only</text>

  <rect x="1000" y="425" width="125" height="90" class="active"/>
  <text x="1062" y="458" text-anchor="middle" class="label">Unlock</text>
  <text x="1062" y="480" text-anchor="middle" class="small">return result</text>

  <rect x="442" y="555" width="126" height="55" class="error"/>
  <text x="505" y="578" text-anchor="middle" class="label">Return error</text>
  <text x="505" y="598" text-anchor="middle" class="small">no RSS check</text>

  <path d="M200 429 H250" class="line"/>
  <path d="M200 514 H225 V490 H250" class="blue-line"/>
  <path d="M430 470 H435" class="line"/>
  <path d="M575 470 H625" class="line"/>
  <text x="598" y="454" text-anchor="middle" class="small">yes</text>
  <path d="M505 520 V555" class="line"/>
  <text x="518" y="542" class="small">no</text>
  <path d="M800 470 H815" class="line"/>
  <path d="M955 470 H1000" class="line"/>
  <text x="978" y="454" text-anchor="middle" class="small">no</text>

  <rect x="640" y="570" width="200" height="68" class="paused"/>
  <text x="740" y="595" text-anchor="middle" class="label">Shard remains locked</text>
  <text x="740" y="616" text-anchor="middle" class="small">queue paused · old retained</text>
  <path d="M885 520 V548 H740 V570" class="orange-line"/>
  <text x="898" y="543" class="small">yes</text>

  <rect x="640" y="670" width="200" height="68" class="standby"/>
  <text x="740" y="695" text-anchor="middle" class="label">Warm standby</text>
  <text x="740" y="716" text-anchor="middle" class="small">open · replay latest</text>
  <path d="M740 638 V670" class="orange-line"/>

  <polygon points="920,660 990,704 920,748 850,704" class="decision"/>
  <text x="920" y="698" text-anchor="middle" class="label">standby RSS</text>
  <text x="920" y="719" text-anchor="middle" class="small">over limit?</text>
  <path d="M830 704 H850" class="orange-line"/>

  <rect x="995" y="655" width="145" height="90" class="paused"/>
  <text x="1067" y="680" text-anchor="middle" class="label">If over</text>
  <text x="1067" y="702" text-anchor="middle" class="small">grow limit ×2</text>
  <text x="1067" y="721" text-anchor="middle" class="small">until &gt; RSS</text>
  <text x="1067" y="739" text-anchor="middle" class="small">warn once</text>
  <path d="M990 704 H995" class="orange-line"/>

  <rect x="870" y="770" width="270" height="38" class="active"/>
  <text x="1005" y="794" text-anchor="middle" class="label">Close old · publish standby · unlock</text>
  <path d="M920 748 V770" class="orange-line"/>
  <text x="903" y="763" text-anchor="end" class="small">no</text>
  <path d="M1067 745 V755 H1045 V770" class="orange-line"/>

  <text x="60" y="792" class="small">Other shards continue serving while this shard is paused.</text>
</svg>
